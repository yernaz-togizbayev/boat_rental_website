# Render blueprint. See docs/DEPLOYMENT.md for the walkthrough.
#
# Native Python runtime, deliberately NOT Docker. Two reasons:
#
#   1. backend/Dockerfile sets FLASK_DEBUG=1 and runs the reloader, because it
#      exists for local Compose development. Deploying it would put interactive
#      tracebacks on the public internet.
# Gunicorn is pointed into backend/ rather than moving rootDir there, so the
# repository keeps its shape and database/ stays alongside for the one-off
# schema load described in docs/DEPLOYMENT.md.
services:
  - type: web
    name: boat-rental
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    # --chdir both changes directory and puts backend/ on sys.path, so "app:app"
    # resolves to the module-level app in backend/app.py with no extra wsgi.py.
    # Threads, because images.py fetches harbour photos with a blocking urlopen
    # on the request thread. 60s, because the 30s default is not enough for a
    # cold connection to a sleeping free-tier database.
    startCommand: >-
      gunicorn --chdir backend --bind 0.0.0.0:$PORT
      --workers 2 --threads 4 --timeout 60 --access-logfile - app:app
    # Not "/": that redirects to /login, which runs Client.query.all() and would
    # fail the deploy whenever the free database is briefly asleep. /credits is
    # template-only -- no database, no network.
    healthCheckPath: /credits
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"            # matches backend/Dockerfile's python:3.11-slim
      - key: SECRET_KEY
        generateValue: true        # never the "dev" fallback on a public host
      - key: DATABASE_URL
        # Paste in the dashboard; never commit it. TLS goes in this URL too --
        # SQLAlchemy reads ssl_ca / ssl_cert / ssl_key / ssl_check_hostname
        # straight out of the query string, so it needs no code.
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"                 # Render terminates TLS, so the cookie can be Secure
      - key: TZ
        value: Europe/Vienna       # payment deadlines are naive DATETIMEs
      - key: IMAGE_FETCH
        value: "off"               # 0.1 CPU; blocking image lookups are not worth it
      # MONGO_URI is deliberately absent. nosql.available() returns False and
      # only the three /manager/nosql* pages degrade; everything else is
      # unaffected. Add a MongoDB Atlas URI here if you want those pages live.
