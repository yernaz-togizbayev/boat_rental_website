{# Shared by the booking search and the availability filter, both of which are
   a start_date/end_date pair. Kept in one file because the two pages had no
   reason to behave differently and every reason to drift if copied. #}
<script>
  // Picking a start date drags the end date to the day after it. Convenience
  // only. The server still decides: validate_end_after_start on the booking
  // form, and the end-before-start guard in analytics().
  (function () {
    var start = document.querySelector('input[name="start_date"]');
    var end = document.querySelector('input[name="end_date"]');
    if (!start || !end) return;

    function nextDay(value) {
      var p = value.split('-');
      // Day + 1 overflows into the next month or year on its own.
      var d = new Date(+p[0], +p[1] - 1, +p[2] + 1);
      return d.getFullYear() + '-' +
             String(d.getMonth() + 1).padStart(2, '0') + '-' +
             String(d.getDate()).padStart(2, '0');
    }

    function sync() {
      if (!start.value) return;
      var earliest = nextDay(start.value);
      // ISO dates compare correctly as strings.
      end.min = earliest;
      if (!end.value || end.value <= start.value) end.value = earliest;
    }

    start.addEventListener('change', sync);
    sync();
  })();
</script>
