services:
  db:
    image: mariadb:11.3
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: boatdb
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      # Same clock as the backend, so a DATETIME written by the app and one
      # written by SQL mean the same thing.
      TZ: "${TZ:-Europe/Vienna}"
    ports:
      # Loopback only. Published as "3306:3306" this is a database with a known
      # root password answering to the whole local network. The backend does not
      # use this mapping at all -- it reaches the db over the compose network by
      # hostname -- so it exists purely for a SQL client on this machine.
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    restart: always
    environment:
      MONGO_INITDB_DATABASE: boatdb
      TZ: "${TZ:-Europe/Vienna}"
    ports:
      # Loopback only, like the relational database. Nothing outside this
      # machine has any business reaching it.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      # Loopback only, so the app is reachable from this machine and nowhere
      # else. It runs with the reloader on, and a development server on
      # 0.0.0.0 puts a Python traceback -- and, with the debugger enabled, a
      # console -- in front of anyone sharing the network. To demo from a phone
      # or another laptop, change this to "5000:5000" for that session and put
      # it back afterwards.
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: boatdb
      DB_USER: user
      DB_PASSWORD: pass
      MONGO_URI: mongodb://mongo:27017/
      MONGO_DB: boatdb
      SECRET_KEY: dev
      # Containers default to UTC, which put every payment deadline two hours
      # behind the wall clock of the harbours this app serves. Rental.CreatedAt
      # and StartTime are naive DATETIMEs, so "now" has to mean local time.
      # Override with TZ=... in .env if you are somewhere else.
      TZ: "${TZ:-Europe/Vienna}"
      # Optional: a free key from unsplash.com/developers gives nicer harbour
      # photos for cities that are not hand-picked. Without it they come from
      # the Wikipedia API instead, so leaving it unset is fine.
      UNSPLASH_ACCESS_KEY: "${UNSPLASH_ACCESS_KEY:-}"
    volumes:
      - ./backend/:/app

volumes:
  mongodata:
